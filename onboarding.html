<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Welcome - CHMAT</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    .onboarding-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; position: relative; }
    .step-box { width: 100%; max-width: 400px; display: none; flex-direction: column; align-items: center; animation: fadeIn 0.3s ease-in-out; }
    .step-box.active { display: flex; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    h1 { font-size: 24px; margin-bottom: 10px; }
    p { color: #888; font-size: 14px; margin-bottom: 30px; }
    
    .dp-preview { width: 120px; height: 120px; border-radius: 50%; background: #262626; border: 2px solid #0095f6; display: flex; justify-content: center; align-items: center; overflow: hidden; margin-bottom: 20px; cursor: pointer; position: relative; }
    .dp-preview img { width: 100%; height: 100%; object-fit: cover; }
    .dp-preview .plus-icon { position: absolute; bottom: 0; right: 0; background: #0095f6; color: #fff; width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; border: 3px solid #000; font-weight: bold; }
    
    input, textarea { width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; padding: 14px; font-size: 15px; margin-bottom: 15px; outline: none; font-family: inherit; resize: none; }
    input:focus, textarea:focus { border-color: #0095f6; }
    
    .btn-primary { width: 100%; background: #0095f6; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 15px; transition: 0.2s; }
    .btn-primary:active { background: #0077c5; }
    .btn-skip { background: none; border: none; color: #888; font-size: 14px; cursor: pointer; padding: 10px; }
    .btn-skip:hover { color: #fff; }
    
    .loading-text { color: #0095f6; font-size: 14px; margin-top: 10px; display: none; }
  
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Cinzel:wght@700&family=Playfair+Display:wght@700&display=swap');

    :root {
        --theme-bg-grad: linear-gradient(135deg, #000000, #3a0000, #000000);
        --theme-primary: #ff0000;
        --theme-text: #ffffff;
        --theme-border: #550000;
        --theme-font: 'Orbitron', sans-serif;
        --theme-btn-radius: 4px;
        --theme-btn-shadow: 0 0 10px #ff0000;
    }

    body { 
        background: var(--theme-bg-grad) !important; 
        background-attachment: fixed !important;
        color: var(--theme-text) !important; 
        font-family: var(--theme-font) !important;
        transition: background 0.5s, color 0.5s; 
    }
    
    .app-header, .bottom-nav, .chat-header, .settings-header { 
        background: rgba(0, 0, 0, 0.4) !important; 
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border-color: var(--theme-border) !important; 
    }
    
    .logo { color: var(--theme-primary) !important; text-shadow: 0 0 15px var(--theme-primary); }
    
    .post-card, .ig-grid-item, .dropdown-menu, .settings-group, .input-group, .theme-card { 
        background: rgba(20, 20, 20, 0.6) !important; 
        backdrop-filter: blur(5px) !important;
        border: 1px solid var(--theme-border) !important; 
    }
    
    button, .ig-btn, .btn-primary, .save-btn, .add-friend-btn, .ig-btn-blue { 
        background: var(--theme-primary) !important; 
        color: #fff !important; 
        border-radius: var(--theme-btn-radius) !important;
        box-shadow: var(--theme-btn-shadow) !important;
        font-family: var(--theme-font) !important;
    }
    
    .nav-item svg { stroke: var(--theme-text) !important; }
    .nav-item.active svg { fill: var(--theme-text) !important; }
    
    /* Override specific black backgrounds that might block the theme */
    .settings-container, .chat-container, .app-container { background: transparent !important; }
    .settings-item { border-color: var(--theme-border) !important; }
    .input-group input { background: transparent !important; color: var(--theme-text) !important; }


    
    </style>
</head>
<body>

  <div class="onboarding-container">
    
    <!-- STEP 1: Profile Picture -->
    <div id="step1" class="step-box active">
      <h1>Add a Profile Picture</h1>
      <p>Let your friends recognize you.</p>
      
      <input type="file" id="dpInput" accept="image/*" style="display: none;">
      <div class="dp-preview" onclick="document.getElementById('dpInput').click()">
        <div id="dpPreviewImg" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-size: 40px; color: #555;">👤</div>
        <div class="plus-icon">+</div>
      </div>
      <div id="dpLoading" class="loading-text">Uploading...</div>

      <button class="btn-primary" id="dpNextBtn" onclick="saveDPAndNext()">Next</button>
      <button class="btn-skip" onclick="goToStep2()">Skip for now</button>
    </div>

    <!-- STEP 2: Display Name & Bio -->
    <div id="step2" class="step-box">
      <h1>Your Profile</h1>
      <p>Tell us a little about yourself.</p>
      
      <input type="text" id="displayNameInput" placeholder="Display Name">
      <textarea id="bioInput" placeholder="Write a short bio..." rows="3"></textarea>

      <button class="btn-primary" onclick="saveProfileInfo()">Finish Setup</button>
      <button class="btn-skip" onclick="finishOnboarding()">Skip for now</button>
    </div>

  </div>

  <script type="module" src="js/onboarding.js"></script>
  <script src="js/themes.js"></script>
</body>
</html>
