<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Create Group - CHMAT</title>
  <link rel="stylesheet" href="css/chat.css">
</head>
<body style="background: #0a0a0a; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column;">
  
  <header class="chat-header" style="background: #000; border-bottom: 1px solid #222; justify-content: space-between;">
    <button class="back-btn" onclick="window.location.href='app.html'">←</button>
    <h2 style="font-size: 17px;">New Group</h2>
    <button id="createGroupBtn" style="background:none; border:none; color:#0095f6; font-weight:bold; font-size:16px; cursor:pointer;">Create</button>
  </header>

  <div style="padding: 20px;">
    <input type="text" id="groupNameInput" placeholder="Group Name..." style="width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 16px; outline: none; margin-bottom: 20px;">
    
    <h3 style="font-size: 14px; color: #888; margin-bottom: 10px;">Select Members</h3>
    <div id="friendsList" style="display: flex; flex-direction: column; gap: 10px;">
      <p style="color: #888;">Loading friends...</p>
    </div>
  </div>

  <script type="module" src="js/group.js"></script>
</body>
</html>
