<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profile - CHMAT</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    .app-container { max-width: 600px; margin: 0 auto; padding-bottom: 60px; }
    
    /* Top Header */
    .ig-top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #262626; }
    .ig-username { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .ig-menu-icon { font-size: 24px; cursor: pointer; padding: 5px; }

    /* Profile Header */
    .ig-profile-header { display: flex; align-items: center; padding: 16px; gap: 20px; }
    .ig-dp-container { position: relative; }
    .ig-dp-img { width: 86px; height: 86px; border-radius: 50%; object-fit: cover; border: 2px solid #333; padding: 2px; }
    .ig-dp-add { position: absolute; bottom: 0; right: 0; background: #0095f6; color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-size: 18px; border: 2px solid #000; font-weight: bold; cursor: pointer; }
    
    /* Stats */
    .ig-stats { display: flex; flex: 1; justify-content: space-around; text-align: center; }
    .ig-stat-item { display: flex; flex-direction: column; font-size: 14px; }
    .ig-stat-num { font-weight: bold; font-size: 16px; }

    /* Bio Section */
    .ig-bio-section { padding: 0 16px 16px 16px; font-size: 14px; }
    .ig-name { font-weight: bold; font-size: 15px; margin-bottom: 2px; }
    .ig-text { color: #d3d3d3; white-space: pre-wrap; line-height: 1.4; }

    /* Action Buttons */
    .ig-action-btns { display: flex; gap: 8px; padding: 0 16px 16px 16px; }
    .ig-btn { flex: 1; background: #262626; color: #fff; border: none; border-radius: 8px; padding: 8px 0; font-size: 14px; font-weight: 600; cursor: pointer; }
    .ig-btn-blue { background: #0095f6; color: #fff; }

    /* Highlights / Stories */
    .ig-highlights { display: flex; gap: 16px; padding: 0 16px 16px 16px; overflow-x: auto; scrollbar-width: none; }
    .ig-highlight-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .ig-highlight-circle { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #333; display: flex; justify-content: center; align-items: center; font-size: 28px; color: #fff; background: #111; cursor: pointer; }
    .ig-highlight-text { font-size: 12px; color: #d3d3d3; }

    /* Tabs */
    .ig-tabs { display: flex; border-top: 1px solid #262626; }
    .ig-tab { flex: 1; text-align: center; padding: 12px 0; font-size: 24px; color: #737373; cursor: pointer; }
    .ig-tab.active { color: #fff; border-bottom: 1px solid #fff; }

    /* Grid Posts */
    .ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .ig-grid-item { aspect-ratio: 1/1; background: #1a1a1a; overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 12px; padding: 8px; text-align: center; }
    .ig-grid-item img { width: 100%; height: 100%; object-fit: cover; }
  
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Cinzel:wght@700&family=Playfair+Display:wght@700&display=swap');

    :root {
        --theme-bg-grad: linear-gradient(135deg, #000000, #3a0000, #000000);
        --theme-primary: #ff0000;
        --theme-text: #ffffff;
        --theme-border: #550000;
        --theme-font: 'Orbitron', sans-serif;
        --theme-btn-radius: 4px;
        --theme-btn-shadow: 0 0 10px #ff0000;
    }

    body { 
        background: var(--theme-bg-grad) !important; 
        background-attachment: fixed !important;
        color: var(--theme-text) !important; 
        font-family: var(--theme-font) !important;
        transition: background 0.5s, color 0.5s; 
    }
    
    .app-header, .bottom-nav, .chat-header, .settings-header { 
        background: rgba(0, 0, 0, 0.4) !important; 
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border-color: var(--theme-border) !important; 
    }
    
    .logo { color: var(--theme-primary) !important; text-shadow: 0 0 15px var(--theme-primary); }
    
    .post-card, .ig-grid-item, .dropdown-menu, .settings-group, .input-group, .theme-card { 
        background: rgba(20, 20, 20, 0.6) !important; 
        backdrop-filter: blur(5px) !important;
        border: 1px solid var(--theme-border) !important; 
    }
    
    button, .ig-btn, .btn-primary, .save-btn, .add-friend-btn, .ig-btn-blue { 
        background: var(--theme-primary) !important; 
        color: #fff !important; 
        border-radius: var(--theme-btn-radius) !important;
        box-shadow: var(--theme-btn-shadow) !important;
        font-family: var(--theme-font) !important;
    }
    
    .nav-item svg { stroke: var(--theme-text) !important; }
    .nav-item.active svg { fill: var(--theme-text) !important; }
    
    /* Override specific black backgrounds that might block the theme */
    .settings-container, .chat-container, .app-container { background: transparent !important; }
    .settings-item { border-color: var(--theme-border) !important; }
    .input-group input { background: transparent !important; color: var(--theme-text) !important; }


    /* --- V4: ULTIMATE THEME VISUALS & ICONS --- */
    
    /* 1. Fix Backgrounds: Make all containers transparent so the gradient shows */
    body, .app-container, .settings-container, .chat-container, .post-card, .ig-grid-item, .settings-group, .input-group, .dropdown-menu, .comment-sheet, .modal-content {
        background: transparent !important;
    }
    
    /* Create a glass effect for cards */
    .post-card, .settings-group, .dropdown-menu, .theme-card {
        background: rgba(10, 10, 10, 0.5) !important;
        backdrop-filter: blur(15px) !important;
        -webkit-backdrop-filter: blur(15px) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37) !important;
    }

    /* 2. Top Header & Notification Heart */
    .app-header, .settings-header, .chat-header {
        background: rgba(0, 0, 0, 0.6) !important;
        backdrop-filter: blur(10px) !important;
        border-bottom: 1px solid var(--theme-primary) !important; /* Glowing bottom border */
    }
    
    /* Change Heart Icon Color & Glow */
    .header-icons svg, #notiBtn svg {
        stroke: var(--theme-primary) !important;
        fill: var(--theme-primary) !important;
        filter: drop-shadow(0 0 8px var(--theme-primary));
        transition: 0.3s;
    }

    /* 3. Bottom Navigation Icons (Home, Search, Post, Chat, Profile) */
    .bottom-nav {
        background: rgba(0, 0, 0, 0.8) !important;
        backdrop-filter: blur(15px) !important;
        border-top: 1px solid var(--theme-primary) !important;
    }
    
    .nav-item svg {
        stroke: var(--theme-text) !important;
        fill: none !important;
        transition: all 0.3s ease;
    }
    
    /* Active Button: Give it the Theme Primary Color and a Neon Glow */
    .nav-item.active svg {
        stroke: var(--theme-primary) !important;
        fill: var(--theme-primary) !important;
        filter: drop-shadow(0 0 10px var(--theme-primary));
        transform: scale(1.1);
    }

    /* 4. Buttons (Like, Comment, Edit Profile, etc) */
    .action-btn, .ig-btn, .save-btn, .btn-primary, .add-friend-btn {
        background: transparent !important;
        color: var(--theme-primary) !important;
        border: 1px solid var(--theme-primary) !important;
        box-shadow: 0 0 10px rgba(0,0,0,0.5) inset !important;
        text-shadow: 0 0 5px var(--theme-primary) !important;
        transition: 0.3s;
    }
    
    .action-btn:active, .ig-btn:active, .btn-primary:active {
        background: var(--theme-primary) !important;
        color: #000 !important; /* Dark text on bright button click */
        box-shadow: 0 0 20px var(--theme-primary) !important;
    }
    
    /* Like button specific */
    .action-btn.liked {
        color: #ff3b30 !important;
        border-color: #ff3b30 !important;
        text-shadow: 0 0 10px #ff3b30 !important;
    }

    /* 5. Text Colors and Tabs */
    .ig-username, .ig-name, .post-display-name, h2, h3 {
        color: var(--theme-text) !important;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    
    .ig-tab.active {
        color: var(--theme-primary) !important;
        border-bottom: 2px solid var(--theme-primary) !important;
        text-shadow: 0 0 8px var(--theme-primary);
    }
    
    .ig-tab {
        color: #888 !important;
    }

    /* 6. Input Fields */
    input, textarea, #messageInput, #commentInput {
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid var(--theme-border) !important;
        color: var(--theme-text) !important;
    }
    
    input:focus, textarea:focus {
        border-color: var(--theme-primary) !important;
        box-shadow: 0 0 8px var(--theme-primary) !important;
    }
    
    /* Logo Glow */
    .logo {
        color: var(--theme-primary) !important;
        text-shadow: 0 0 15px var(--theme-primary), 0 0 30px var(--theme-primary) !important;
    }


    /* --- WHITE QUEEN SPECIFIC UI FIXES --- */
    body.theme-white-queen button, 
    body.theme-white-queen .ig-btn, 
    body.theme-white-queen .btn-primary, 
    body.theme-white-queen .action-btn,
    body.theme-white-queen .add-friend-btn {
        background: #ffffff !important;
        color: #111111 !important;
        border: 2px solid #d4af37 !important; /* Gold Border */
        box-shadow: 0 4px 10px rgba(212, 175, 55, 0.2) !important;
        transition: all 0.2s ease !important;
    }
    
    body.theme-white-queen button:active, 
    body.theme-white-queen .ig-btn:active {
        background: #fffdf5 !important;
        box-shadow: 0 0 20px #d4af37, 0 0 40px #d4af37 !important; /* Gold Blink/Glow */
        transform: scale(0.95);
    }

    /* Fix Bottom Nav visibility */
    body.theme-white-queen .bottom-nav {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 2px solid #d4af37 !important;
    }
    body.theme-white-queen .nav-item svg {
        stroke: #111111 !important; /* Dark icons for visibility */
    }
    body.theme-white-queen .nav-item.active svg {
        stroke: #d4af37 !important; /* Gold when active */
        fill: #d4af37 !important;
    }
    
    /* Fix Text Visibility */
    body.theme-white-queen .post-card, 
    body.theme-white-queen .ig-top-bar,
    body.theme-white-queen .app-header {
        background: rgba(255, 255, 255, 0.8) !important;
        border-bottom: 1px solid #d4af37 !important;
    }
    body.theme-white-queen .ig-username,
    body.theme-white-queen .post-display-name,
    body.theme-white-queen .logo {
        color: #111111 !important;
        text-shadow: none !important;
    }
    body.theme-white-queen .ig-dp-img {
        border: 2px solid #d4af37 !important;
    }


    /* --- GLOBAL BUTTON STYLING (The Real Fix) --- */
    
    /* 1. General Buttons (Dark Themes) */
    .ig-btn, .btn-primary, .action-btn, .save-btn, .add-friend-btn {
        background: var(--theme-primary) !important;
        color: #ffffff !important;
        border: 1px solid var(--theme-primary) !important;
        border-radius: 8px !important;
        transition: all 0.2s ease-in-out !important;
    }

    /* 2. White Queen Specific (White Background + Gold Border) */
    body.theme-white-queen .ig-btn, 
    body.theme-white-queen .btn-primary, 
    body.theme-white-queen .action-btn, 
    body.theme-white-queen .save-btn,
    body.theme-white-queen .add-friend-btn {
        background: #ffffff !important;
        color: var(--theme-primary) !important; /* Gold Text */
        border: 2px solid var(--theme-primary) !important; /* Gold Border */
        box-shadow: 0 4px 10px rgba(212, 175, 55, 0.2) !important;
    }

    /* 3. Click/Touch Effect */
    .ig-btn:active, .btn-primary:active, .action-btn:active {
        transform: scale(0.95);
    }
    body.theme-white-queen .ig-btn:active {
        background: var(--theme-primary) !important;
        color: #ffffff !important;
        box-shadow: 0 0 15px var(--theme-primary) !important;
    }

    /* 4. Bottom Nav Icons Visibility */
    body.theme-white-queen .nav-item svg {
        stroke: #333333 !important;
    }
    body.theme-white-queen .nav-item.active svg {
        stroke: var(--theme-primary) !important;
        fill: var(--theme-primary) !important;
        filter: drop-shadow(0 0 5px var(--theme-primary));
    }
    
    /* 5. Fix Logo Text */
    body.theme-white-queen .logo {
        color: #111111 !important;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.5) !important;
    }

</style>
</head>
<body>
  <div class="app-container">
    <main id="viewProfileContent">
      <div style="text-align: center; padding: 50px; color: #888;">Loading Profile...</div>
    </main>
  </div>

  <script type="module">
    import { auth, db, authReady } from './js/firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { doc, getDoc, getDocs, deleteDoc, collection, query, where, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const targetUid = urlParams.get('uid');
    const content = document.getElementById('viewProfileContent');
    let currentUser = null;

    authReady.then(() => {
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          currentUser = user;
          if(!targetUid) { window.location.href = 'app.html'; return; }
          loadUserProfile();
        } else {
          window.location.href = 'login.html';
        }
      });
    });

    async function loadUserProfile() {
      try {
        const docSnap = await getDoc(doc(db, "users", targetUid));
        if (docSnap.exists()) {
          const data = docSnap.data();
          const displayName = data.displayName || data.username;
          const initial = displayName.charAt(0).toUpperCase();
          const avatar = data.profilePicUrl ? `<img src="${data.profilePicUrl}" class="ig-dp-img">` : `<div class="ig-dp-img" style="display:flex; justify-content:center; align-items:center; background:#333; font-size:32px;">${initial}</div>`;

          const myDoc = await getDoc(doc(db, "users", currentUser.uid));
          const myData = myDoc.data() || {};
          const isFriend = myData.friends && myData.friends.includes(targetUid);
          
          let isRequested = false;
          let reqId = null;
          let incomingReqId = null;

          if(currentUser.uid !== targetUid && !isFriend) {
              try {
                  // Check 1: Kya humne usko request bheji hai? (Outgoing)
                  const qOutgoing = query(collection(db, "friend_requests"), where("senderId", "==", currentUser.uid));
                  const outSnap = await getDocs(qOutgoing);
                  outSnap.forEach(doc => {
                      const d = doc.data();
                      if (d.receiverId === targetUid && d.status === 'pending') {
                          isRequested = true;
                          reqId = doc.id;
                      }
                  });

                  // Check 2: Kya usne humein request bheji hai? (Incoming)
                  const qIncoming = query(collection(db, "friend_requests"), where("receiverId", "==", currentUser.uid));
                  const inSnap = await getDocs(qIncoming);
                  inSnap.forEach(doc => {
                      const d = doc.data();
                      if (d.senderId === targetUid && d.status === 'pending') {
                          incomingReqId = doc.id;
                      }
                  });
              } catch(e) {
                  console.error("Request check error:", e);
              }
          }

          let btnHtml = '';
          if(currentUser.uid === targetUid) {
             btnHtml = `<button class="ig-btn" onclick="window.location.href='edit-profile.html'">Edit profile</button>
                        <button class="ig-btn" onclick="navigator.clipboard.writeText(window.location.href); alert('Profile link copied!')">Share profile</button>`;
          } else if(isFriend) {
              btnHtml = `<button class="ig-btn ig-btn-blue" onclick="window.location.href='chat.html?uid=${targetUid}&name=${data.username}'">Message</button>`;
          } else if (incomingReqId) {
              // Facebook Style Confirm and Delete Buttons
              btnHtml = `<button class="ig-btn ig-btn-blue" style="flex: 2;" onclick="acceptReqFromProfile('${incomingReqId}', '${targetUid}', '${data.username}')">Confirm req</button>
                         <button class="ig-btn" style="flex: 1; background: #e4e6eb; color: #000;" onclick="rejectReqFromProfile('${incomingReqId}')">Delete</button>`;
          } else if (isRequested) {
              btnHtml = `<button class="ig-btn" style="background:#262626; color:#ff3b30; border:1px solid #333;" onclick="promptCancelReq('${reqId}')">Cancel Request</button>`;
          } else {
              btnHtml = `<button class="ig-btn ig-btn-blue" onclick="sendReq(this)">Add Friend</button>`;
          }

          content.innerHTML = `
            <!-- Top Bar -->
            <div class="ig-top-bar">
              <div class="ig-username">${data.username} <span style="font-size:12px;">▼</span></div>
              <div class="ig-menu-icon" onclick="window.location.href='settings.html'">☰</div>
            </div>

            <!-- Profile Header (DP + Stats) -->
            <div class="ig-profile-header">
              <div class="ig-dp-container">
                ${avatar}
                ${currentUser.uid === targetUid ? '<div class="ig-dp-add" onclick="window.location.href=\'edit-profile.html\'">+</div>' : ''}
              </div>
              <div class="ig-stats">
                <div class="ig-stat-item"><span class="ig-stat-num" id="postCount">0</span>posts</div>
                <div class="ig-stat-item"><span class="ig-stat-num">${data.friends ? data.friends.length : 0}</span>friends</div>
                <div class="ig-stat-item"><span class="ig-stat-num">0</span>following</div>
              </div>
            </div>

            <!-- Bio Section -->
            <div class="ig-bio-section">
              <div class="ig-name">${displayName}</div>
              <div class="ig-text">${data.bio || "No bio yet."}</div>
            </div>

            <!-- Action Buttons -->
            <div class="ig-action-btns">
              ${btnHtml}
            </div>

            <!-- Highlights/Story Rings -->
            <div class="ig-highlights">
              <div class="ig-highlight-item" onclick="alert('Gallery open feature coming soon!')">
                <div class="ig-highlight-circle">+</div>
                <div class="ig-highlight-text">New</div>
              </div>
              <div class="ig-highlight-item">
                <div class="ig-highlight-circle" style="background:#222;">😎</div>
                <div class="ig-highlight-text">Memories</div>
              </div>
              <div class="ig-highlight-item">
                <div class="ig-highlight-circle" style="background:#222;">🔥</div>
                <div class="ig-highlight-text">Vibes</div>
              </div>
            </div>

            <!-- Tabs -->
            <div class="ig-tabs">
              <div class="ig-tab active">▦</div>
              <div class="ig-tab">▶</div>
              <div class="ig-tab">👤</div>
            </div>

            <!-- Posts Grid -->
            <div class="ig-grid" id="userPosts"></div>
          `;
          loadUserPosts();
        } else {
          content.innerHTML = `<p style="color:red; text-align:center; padding:20px;">User not found!</p>`;
        }
      } catch(e) { content.innerHTML = `<p style="color:red; text-align:center; padding:20px;">Error: ${e.message}</p>`; }
    }

    

window.acceptReqFromProfile = async function(reqId, senderId, senderUsername) {
    try {
        await deleteDoc(doc(db, "friend_requests", reqId));
        await updateDoc(doc(db, "users", currentUser.uid), { friends: arrayUnion(senderId) });
        await updateDoc(doc(db, "users", senderId), { friends: arrayUnion(currentUser.uid) });
        
        // Notification to sender
        const myDoc = await getDoc(doc(db, "users", currentUser.uid));
        await addDoc(collection(db, "notifications"), {
            receiverId: senderId, 
            senderId: currentUser.uid, 
            senderUsername: myDoc.data().username, 
            type: "friend_accept", 
            read: false, 
            createdAt: serverTimestamp()
        });
        window.location.reload();
    } catch(e) { alert("Error accepting request: " + e.message); }
};

window.rejectReqFromProfile = async function(reqId) {
    if(!confirm("Are you sure you want to delete this request?")) return;
    try {
        await deleteDoc(doc(db, "friend_requests", reqId));
        window.location.reload();
    } catch(e) { alert("Error deleting request: " + e.message); }
};

window.promptCancelReq = function(reqId) {
    const modal = document.getElementById('cancelReqModal');
    modal.style.display = 'flex';
    document.getElementById('confirmCancelReqBtn').onclick = async () => {
        try {
            await deleteDoc(doc(db, "friend_requests", reqId));
            modal.style.display = 'none';
            window.location.reload();
        } catch(e) { alert("Error: " + e.message); }
    };
};

    window.sendReq = async function(btn) {
        btn.innerText = "Sending..."; btn.disabled = true;
        try {
            await addDoc(collection(db, "friend_requests"), { senderId: currentUser.uid, senderUsername: (await getDoc(doc(db, "users", currentUser.uid))).data().username, receiverId: targetUid, status: "pending", createdAt: serverTimestamp() });
            btn.innerText = "Requested";
        } catch(e) { alert("Error: " + e.message); btn.innerText = "Add Friend"; btn.disabled = false; }
    }

    function loadUserPosts() {
      const postsDiv = document.getElementById('userPosts');
      const postCountSpan = document.getElementById('postCount');
      const q = query(collection(db, "posts"), where("uid", "==", targetUid));
      onSnapshot(q, (snapshot) => {
        let posts = []; snapshot.forEach((doc) => { posts.push(doc.data()); });
        posts.sort((a,b) => { return (b.createdAt ? b.createdAt.toMillis() : 0) - (a.createdAt ? a.createdAt.toMillis() : 0); });
        
        if(postCountSpan) postCountSpan.innerText = posts.length;

        let html = '';
        posts.forEach((post) => {
          if(post.privacy === "Public" || post.uid === currentUser.uid) {
             if(post.imageUrl) {
                 html += `<div class="ig-grid-item"><img src="${post.imageUrl}"></div>`;
             } else if(post.text) {
                 html += `<div class="ig-grid-item"><span style="color:#fff;">${post.text}</span></div>`;
             }
          }
        });
        postsDiv.innerHTML = html !== '' ? html : '<p style="color:#888; grid-column: 1 / -1; text-align:center; padding:20px;">No posts yet.</p>';
      });
    }
  </script>

<div id="cancelReqModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:99999; justify-content:center; align-items:center;">
  <div style="background:#1c1c1e; padding:20px; border-radius:12px; width:80%; max-width:300px; text-align:center; border: 1px solid #333;">
    <h3 style="color:#fff; margin-top:0; font-size:18px;">Cancel Request</h3>
    <p style="color:#aaa; font-size:14px; margin-bottom:20px;">Are you sure you want to cancel this friend request?</p>
    <div style="display:flex; gap:10px;">
      <button onclick="document.getElementById('cancelReqModal').style.display='none'" style="flex:1; background:#262626; color:#fff; border:none; padding:12px; border-radius:8px; cursor:pointer; font-weight:bold;">No</button>
