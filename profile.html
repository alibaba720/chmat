<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profile - CHMAT</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body style="background: #000; color: #fff;">
  <div class="app-container">
    <header class="app-header">
      <button class="back-btn" onclick="window.location.href='app.html'" style="background:none; border:none; color:#fff; font-size:24px; margin-right:15px; cursor:pointer;">←</button>
      <div class="logo">Profile</div>
    </header>
    <main class="app-content" id="viewProfileContent" style="padding: 16px;">
      <h2>Loading Profile...</h2>
    </main>
  </div>

  <script type="module">
    import { auth, db, authReady } from './js/firebase-config.js'; 
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { doc, getDoc, collection, query, where, onSnapshot, addDoc, updateDoc, arrayUnion, arrayRemove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const targetUid = urlParams.get('uid');
    const content = document.getElementById('viewProfileContent');
    let currentUser = null;

    authReady.then(() => {
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          currentUser = user;
          if(!targetUid || targetUid === currentUser.uid) { window.location.href = 'app.html'; return; }
          loadUserProfile();
        } else {
          window.location.href = 'login.html';
        }
      });
    });

    async function loadUserProfile() {
      try {
        const docSnap = await getDoc(doc(db, "users", targetUid));
        if (docSnap.exists()) {
          const data = docSnap.data();
          const displayName = data.displayName || data.username;
          const initial = displayName.charAt(0).toUpperCase();
          const avatar = data.profilePicUrl ? `<img src="${data.profilePicUrl}" style="width:80px; height:80px; border-radius:50%; object-fit:cover;">` : `<div class="profile-avatar">${initial}</div>`;
          
          const myDoc = await getDoc(doc(db, "users", currentUser.uid));
          const myData = myDoc.data() || {};
          const isFriend = myData.friends && myData.friends.includes(targetUid);

          let btnHtml = '';
          if(isFriend) {
              btnHtml = `<button onclick="window.location.href='chat.html?uid=${targetUid}&name=${data.username}'" style="flex:1; background:#0095f6; color:#fff; border:none; padding:10px; border-radius:8px; font-weight:600; cursor:pointer;">Message</button>`;
          } else {
              btnHtml = `<button onclick="sendReq(this)" style="flex:1; background:#0095f6; color:#fff; border:none; padding:10px; border-radius:8px; font-weight:600; cursor:pointer;">Add Friend</button>`;
          }

          content.innerHTML = `
            <div class="profile-container" style="padding: 0;">
              <div class="profile-header">
                ${avatar}
                <div class="profile-stats">
                  <div class="stat-item"><span>${data.friends ? data.friends.length : 0}</span>Friends</div>
                </div>
              </div>
              <div class="profile-info">
                <h2 class="display-name">${displayName}</h2>
                <p class="username">@${data.username}</p>
                <p class="bio">${data.bio || "No bio yet."}</p>
              </div>
              <div style="display:flex; gap:10px; margin-top:15px;">
                ${btnHtml}
              </div>
            </div>
            <h3 style="margin-top:20px; border-bottom:1px solid #333; padding-bottom:10px;">Posts</h3>
            <div id="userPosts"></div>
          `;
          loadUserPosts();
        } else {
          content.innerHTML = `<p style="color:red; text-align:center;">User not found!</p>`;
        }
      } catch(e) { content.innerHTML = `<p style="color:red; text-align:center;">Error: ${e.message}</p>`; }
    }

    window.sendReq = async function(btn) {
        btn.innerText = "Sending..."; btn.disabled = true;
        try {
            await addDoc(collection(db, "friend_requests"), { senderId: currentUser.uid, senderUsername: (await getDoc(doc(db, "users", currentUser.uid))).data().username, receiverId: targetUid, status: "pending", createdAt: serverTimestamp() });
            btn.innerText = "Requested";
        } catch(e) { alert("Error: " + e.message); btn.innerText = "Add Friend"; btn.disabled = false; }
    }

    function loadUserPosts() {
      const postsDiv = document.getElementById('userPosts');
      const q = query(collection(db, "posts"), where("uid", "==", targetUid)); 
      onSnapshot(q, (snapshot) => {
        let posts = []; snapshot.forEach((doc) => { posts.push(doc.data()); });
        posts.sort((a,b) => { return (b.createdAt ? b.createdAt.toMillis() : 0) - (a.createdAt ? a.createdAt.toMillis() : 0); });
        let html = '';
        posts.forEach((post) => {
          if(post.privacy === "Public") { 
             html += `<div class="post-card" style="margin-bottom:10px;"><div class="post-text">${post.text || ''}</div>${post.imageUrl ? `<img src="${post.imageUrl}" class="post-image">` : ''}</div>`;
          }
        });
        postsDiv.innerHTML = html !== '' ? html : '<p style="color:#888;">No public posts.</p>';
      });
    }
  </script>
</body>
</html>
