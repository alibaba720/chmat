<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edit Profile - CHMAT</title>
  <link rel="stylesheet" href="css/edit-profile.css?v=2">
</head>
<body>
  <div class="edit-container">
    <header class="edit-header">
      <span class="back-btn" onclick="window.location.href='app.html'">←</span>
      <h2>Edit Profile</h2>
      <span class="save-btn" id="saveBtn">Save</span>
    </header>

    <label for="dpUpload" class="profile-pic-section" style="cursor: pointer; display: flex; flex-direction: column; align-items: center; padding: 24px 16px;">
      <img id="editAvatarImg" class="edit-avatar" style="display:none; object-fit:cover;">
      <div class="edit-avatar" id="editAvatar">B</div>
      <p class="change-photo-text" id="dpStatus">Change Profile Photo</p>
      <input type="file" id="dpUpload" accept="image/*" style="display:none;">
    </label>

    <div class="form-group">
      <label>Display Name</label>
      <input type="text" id="displayNameInput" placeholder="Your Name" maxlength="50">
    </div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="usernameInput" placeholder="username" maxlength="20">
    </div>

    <div class="form-group">
      <label>Bio</label>
      <textarea id="bioInput" placeholder="Write something about yourself..." maxlength="300"></textarea>
      <small class="char-count"><span id="bioCount">0</span>/300</small>
    </div>
  </div>

  <script type="module" src="js/edit-profile.js?v=2"></script>
</body>
</html>
