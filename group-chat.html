<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Group Chat - CHMAT</title>
  <link rel="stylesheet" href="css/chat.css?v=2">
  <style>
    /* Naya design mic/send toggle aur clickable header ke liye */
    .chat-input-area { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid #222; background: #000; }
    #messageInput { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 20px; padding: 10px 16px; color: #fff; outline: none; }
    .action-btn { background: none; border: none; color: #0095f6; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    .action-btn svg { width: 24px; height: 24px; fill: currentColor; }
    .chat-user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  
    /* --- V4: ULTIMATE THEME VISUALS & ICONS --- */
    
    /* 1. Fix Backgrounds: Make all containers transparent so the gradient shows */
    body, .app-container, .settings-container, .chat-container, .post-card, .ig-grid-item, .settings-group, .input-group, .dropdown-menu, .comment-sheet, .modal-content {
        background: transparent !important;
    }
    
    /* Create a glass effect for cards */
    .post-card, .settings-group, .dropdown-menu, .theme-card {
        background: rgba(10, 10, 10, 0.5) !important;
        backdrop-filter: blur(15px) !important;
        -webkit-backdrop-filter: blur(15px) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37) !important;
    }

    /* 2. Top Header & Notification Heart */
    .app-header, .settings-header, .chat-header {
        background: rgba(0, 0, 0, 0.6) !important;
        backdrop-filter: blur(10px) !important;
        border-bottom: 1px solid var(--theme-primary) !important; /* Glowing bottom border */
    }
    
    /* Change Heart Icon Color & Glow */
    .header-icons svg, #notiBtn svg {
        stroke: var(--theme-primary) !important;
        fill: var(--theme-primary) !important;
        filter: drop-shadow(0 0 8px var(--theme-primary));
        transition: 0.3s;
    }

    /* 3. Bottom Navigation Icons (Home, Search, Post, Chat, Profile) */
    .bottom-nav {
        background: rgba(0, 0, 0, 0.8) !important;
        backdrop-filter: blur(15px) !important;
        border-top: 1px solid var(--theme-primary) !important;
    }
    
    .nav-item svg {
        stroke: var(--theme-text) !important;
        fill: none !important;
        transition: all 0.3s ease;
    }
    
    /* Active Button: Give it the Theme Primary Color and a Neon Glow */
    .nav-item.active svg {
        stroke: var(--theme-primary) !important;
        fill: var(--theme-primary) !important;
        filter: drop-shadow(0 0 10px var(--theme-primary));
        transform: scale(1.1);
    }

    /* 4. Buttons (Like, Comment, Edit Profile, etc) */
    .action-btn, .ig-btn, .save-btn, .btn-primary, .add-friend-btn {
        background: transparent !important;
        color: var(--theme-primary) !important;
        border: 1px solid var(--theme-primary) !important;
        box-shadow: 0 0 10px rgba(0,0,0,0.5) inset !important;
        text-shadow: 0 0 5px var(--theme-primary) !important;
        transition: 0.3s;
    }
    
    .action-btn:active, .ig-btn:active, .btn-primary:active {
        background: var(--theme-primary) !important;
        color: #000 !important; /* Dark text on bright button click */
        box-shadow: 0 0 20px var(--theme-primary) !important;
    }
    
    /* Like button specific */
    .action-btn.liked {
        color: #ff3b30 !important;
        border-color: #ff3b30 !important;
        text-shadow: 0 0 10px #ff3b30 !important;
    }

    /* 5. Text Colors and Tabs */
    .ig-username, .ig-name, .post-display-name, h2, h3 {
        color: var(--theme-text) !important;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    
    .ig-tab.active {
        color: var(--theme-primary) !important;
        border-bottom: 2px solid var(--theme-primary) !important;
        text-shadow: 0 0 8px var(--theme-primary);
    }
    
    .ig-tab {
        color: #888 !important;
    }

    /* 6. Input Fields */
    input, textarea, #messageInput, #commentInput {
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid var(--theme-border) !important;
        color: var(--theme-text) !important;
    }
    
    input:focus, textarea:focus {
        border-color: var(--theme-primary) !important;
        box-shadow: 0 0 8px var(--theme-primary) !important;
    }
    
    /* Logo Glow */
    .logo {
        color: var(--theme-primary) !important;
        text-shadow: 0 0 15px var(--theme-primary), 0 0 30px var(--theme-primary) !important;
    }


    
    /* --- WHITE QUEEN (ICE & GOLD) OVERRIDES --- */
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap');

    /* 1. Main Background - Ice White */
    body.theme-white-queen, 
    body.theme-white-queen .app-container, 
    body.theme-white-queen .app-content,
    body.theme-white-queen .post-card,
    body.theme-white-queen .profile-container,
    body.theme-white-queen .settings-group {
        background: linear-gradient(135deg, #f0f8ff 0%, #e6e6fa 100%) !important; /* Ice white/silver gradient */
        color: #111111 !important;
    }

    /* 2. Logo - Icy Blue Glow */
    body.theme-white-queen .logo {
        font-family: 'Cinzel Decorative', serif !important;
        color: #00e5ff !important; /* Icy Blue */
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.8), 0 0 20px rgba(0, 229, 255, 0.5) !important;
    }

    /* 3. Transparent Bottom Nav with Gold Border */
    body.theme-white-queen .bottom-nav {
        background: rgba(255, 255, 255, 0.4) !important; /* Transparent Glass */
        backdrop-filter: blur(15px) !important;
        -webkit-backdrop-filter: blur(15px) !important;
        border-top: 2px solid #d4af37 !important; /* Gold Border */
    }

    /* Bottom Nav Icons */
    body.theme-white-queen .nav-item svg {
        stroke: #b8860b !important; /* Dark Gold */
    }
    body.theme-white-queen .nav-item.active svg {
        stroke: #00e5ff !important; /* Icy Blue for Active */
        fill: #00e5ff !important;
        filter: drop-shadow(0 0 8px #00e5ff) !important;
    }

    /* 4. Buttons (Edit profile, etc) - Ice & Gold */
    body.theme-white-queen .ig-btn, 
    body.theme-white-queen .btn-primary, 
    body.theme-white-queen .action-btn {
        background: rgba(255, 255, 255, 0.6) !important; /* Semi transparent white */
        color: #b8860b !important; /* Dark Gold text */
        border: 1px solid #d4af37 !important; /* Gold border */
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05) !important;
    }
    body.theme-white-queen .ig-btn:active {
        background: #d4af37 !important;
        color: #ffffff !important;
        box-shadow: 0 0 15px #d4af37 !important;
    }
    
    /* Fix Text Colors */
    body.theme-white-queen .ig-username, 
    body.theme-white-queen .ig-name, 
    body.theme-white-queen .display-name,
    body.theme-white-queen .post-display-name {
        color: #111111 !important;
    }

</style>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <button class="back-btn" onclick="window.history.back()">←</button>
      <!-- Header par click karne se group info khulegi -->
      <div class="chat-user-info" onclick="if(typeof openGroupInfo === 'function') openGroupInfo();">
        <div class="chat-avatar" style="background: #0095f6; color: white; overflow: hidden; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; font-weight: bold;" id="chatAvatar">G</div>
        <div class="chat-name" id="chatName" style="font-weight: 600;">Loading...</div>
      </div>
    </header>

    <main class="chat-messages" id="chatMessages"></main>

    <footer class="chat-input-area">
      <input type="text" id="messageInput" placeholder="Message group..." autocomplete="off">
      
      <!-- Mic Button -->
      <button id="micBtn" class="action-btn" style="display: block;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <!-- Send Button -->
      <button id="sendMessageBtn" class="action-btn" style="display: none;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"></path>
        </svg>
      </button>
    </footer>
  </div>

  <script type="module" src="js/group-chat.js"></script>
</body>
</html>
