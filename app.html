<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CHMAT</title>
  <link rel="stylesheet" href="css/app.css?v=200">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">CHMAT</div>
      <div class="header-icons">
        <div class="noti-icon-wrapper" id="notiBtn">
          <span class="icon">🤍</span>
          <span class="noti-dot hidden" id="notiDot"></span>
          <span class="noti-count hidden" id="notiCount">0</span>
        </div>
      </div>
    </header>

    <main class="app-content" id="mainContent">
      <!-- Home Tab is Active by Default -->
      <div id="homeTab" class="tab-content">
        <div class="stories-container" id="storiesContainer">
          <!-- Story Rings will load here -->
        </div>
        <div id="feedContainer">
          <p style="text-align: center; color: #888; margin-top: 20px;">Loading Feed...</p>
        </div>
      </div>

      <div id="searchTab" class="tab-content hidden">
        <div class="search-container">
          <input type="text" id="searchInput" placeholder="Search by username..." autocomplete="off">
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>

      <div id="chatTab" class="tab-content hidden">
        <div style="padding: 16px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center;">
          <h2 style="font-size: 18px; font-weight: 600;">Messages</h2>
          <button onclick="window.location.href='group.html'" style="background:none; border:none; color:#0095f6; font-weight:bold; font-size:14px; cursor:pointer;">+ New Group</button>
        </div>
        <div id="chatList" class="search-results" style="padding-top: 10px;"></div>
      </div>

      <div id="profileTab" class="tab-content hidden">
        <div id="profileInfoContainer"></div>
        <div id="myPostsContainer" style="margin-top: 20px; border-top: 1px solid #1a1a1a;"></div>
      </div>

      <div id="notiTab" class="tab-content hidden">
        <div style="padding: 16px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center;">
          <button class="back-btn" id="backFromNoti" style="background:none; border:none; color:#fff; font-size:20px; margin-right:10px; cursor:pointer;">←</button>
          <h2 style="font-size: 18px; font-weight: 600;">Notifications</h2>
        </div>
        <div id="notiList" class="search-results" style="padding-top: 10px;"></div>
      </div>
    </main>

    <nav class="bottom-nav">
      <div class="nav-item active" data-tab="homeTab">🏠</div>
      <div class="nav-item" data-tab="searchTab">🔍</div>
      <div class="nav-item" data-tab="post">➕</div>
      <div class="nav-item" data-tab="chatTab">💬</div>
      <div class="nav-item" data-tab="profileTab">👤</div>
    </nav>
  </div>

  <div id="dropdownMenu" class="dropdown-menu hidden">
    <div class="dropdown-item hidden" id="adminPanelBtn" style="color: #ffd700;">👑 Admin Panel</div>
    <div class="dropdown-item" id="settingsBtn">⚙️ Settings</div>
    <div class="dropdown-item" id="logoutBtn" style="color: #ff3b30;">🚪 Logout</div>
  </div>

  <div id="friendsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: rgba(0,0,0,0.8); align-items: flex-end;"><div onclick="closeFriendsModal()" style="position: absolute; width: 100%; height: 100%;"></div><div style="background: #111; width: 100%; height: 70vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; position: relative;"><div style="padding: 16px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center;"><h3 style="color:#fff; font-size:16px;">Friends</h3><button onclick="closeFriendsModal()" style="background:none; border:none; color:#fff; font-size:20px;">✕</button></div><div id="friendsListContainer" style="flex: 1; overflow-y: auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 10px;"></div></div></div><div id="storyViewerModal" class="story-viewer-modal hidden">
    <div class="story-progress-bar"><div id="storyProgress" class="story-progress-fill"></div></div>
    <div class="story-header">
        <div class="story-user-info">
            <div class="story-avatar-small" id="storyViewerAvatar"></div>
            <span id="storyViewerName"></span>
            <span id="storyViewerTime" style="font-size:12px; color:#aaa; margin-left:8px;"></span>
        </div>
        <button onclick="closeStoryViewer()" style="background:none; border:none; color:#fff; font-size:24px;">✕</button>
    </div>
    <div class="story-image-container">
        <img id="storyViewerImage" src="" alt="Story">
    </div>
    <div class="story-nav-areas">
        <div class="story-nav-left" onclick="prevStory()"></div>
        <div class="story-nav-right" onclick="nextStory()"></div>
    </div>
</div>

<!-- COMMENT MODAL -->
  <div id="commentModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: rgba(0,0,0,0.8); align-items: flex-end;">
    <div class="comment-overlay" onclick="closeCommentModal()" style="position: absolute; width: 100%; height: 100%;"></div>
    <div class="comment-sheet" style="background: #111; width: 100%; height: 70vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; position: relative;">
      <div class="comment-header" style="display:flex; justify-content:space-between; padding:16px; border-bottom:1px solid #222;">
        <h3 style="color:#fff; font-size:16px;">Comments</h3>
        <button onclick="closeCommentModal()" style="background:none; border:none; color:#fff; font-size:20px;">✕</button>
      </div>
      <div class="comment-list" id="commentList" style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;"></div>
      <div id="replyIndicator" style="display: none; padding: 8px 16px; background: #1a1a1a; font-size: 13px; color: #aaa;">
        Replying to <b id="replyUsernameText" style="color: #0095f6;"></b>
        <button onclick="cancelReply()" style="background: none; border: none; color: #ff3b30; margin-left:10px; cursor:pointer;">✕ Cancel</button>
      </div>
      <div class="comment-input-area" style="display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid #222; background: #000;">
        <input type="text" id="commentInput" placeholder="Add a comment..." style="flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 20px; padding: 10px 16px; color: #fff; outline: none;">
        <button id="sendCommentBtn" style="background: none; border: none; color: #0095f6; font-weight: 600; font-size: 14px; cursor: pointer;">Post</button>
      </div>
    </div>
  </div>

  <!-- POST OPTIONS MODAL -->
  <div id="postOptionsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; background: rgba(0,0,0,0.7); align-items: flex-end;">
    <div onclick="closePostOptions()" style="position: absolute; width: 100%; height: 100%;"></div>
    <div style="background: #1c1c1e; width: 100%; border-radius: 20px 20px 0 0; padding: 20px 0; position: relative; display: flex; flex-direction: column;">
      <div style="text-align:center; padding-bottom: 15px; border-bottom: 1px solid #333; margin-bottom: 10px; color: #888; font-size: 13px; font-weight: bold;">Post Options</div>
      <div onclick="changePrivacyAction('Public')" style="padding: 16px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; color: #fff; font-size: 15px;"><span style="font-size:20px;">🌍</span> Public</div>
      <div onclick="changePrivacyAction('Friends')" style="padding: 16px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; color: #fff; font-size: 15px;"><span style="font-size:20px;">👥</span> Friends</div>
      <div onclick="changePrivacyAction('Only Me')" style="padding: 16px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; color: #fff; font-size: 15px;"><span style="font-size:20px;">🔒</span> Only Me</div>
      <div style="height: 8px; background: #000; margin: 10px 0;"></div>
      <div onclick="deletePostAction()" style="padding: 16px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; color: #ff3b30; font-size: 15px; font-weight: bold;"><span style="font-size:20px;">🗑️</span> Delete Post</div>
      <div onclick="closePostOptions()" style="padding: 16px 20px; text-align: center; color: #aaa; cursor: pointer; border-top: 1px solid #333; margin-top: 10px;">Cancel</div>
    </div>
  </div>

  <script type="module" src="js/app.js?v=200"></script>
</body>
</html>
