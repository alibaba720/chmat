<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat - CHMAT</title>
  <link rel="stylesheet" href="css/chat.css?v=25">
</head>
<body>
  <div class="chat-container">
    <!-- Chat Header -->
    <header class="chat-header">
      <div style="display:flex; align-items:center; flex:1;">
        <button class="back-btn" onclick="window.location.href='app.html'">←</button>
        <div class="chat-user-info">
          <div class="chat-avatar" id="chatAvatar">U</div>
          <div class="chat-name" id="chatName">Loading...</div>
        </div>
      </div>
      <div class="chat-header-icons">
        <span onclick="alert('Audio Call coming soon!')">📞</span>
        <span onclick="alert('Video Call coming soon!')">📹</span>
        <span onclick="openChatInfo()" style="cursor:pointer;">ℹ️</span>
      </div>
    </header>

    <!-- Chat Messages -->
    <main class="chat-messages" id="chatMessages"></main>

    <!-- Recording Overlay -->
    <div id="recordingOverlay" class="recording-overlay hidden">
      <div class="recording-content">
        <button id="deleteRecordBtn" class="delete-record-btn" onclick="cancelRecording()">🗑️</button>
        <div id="waveform-container" class="waveform-container"></div>
        <div id="recordingTimer" class="recording-timer">0:00</div>
        <button id="stopRecordBtn" class="stop-record-btn" onclick="stopAndSendRecording()">➡️</button>
      </div>
    </div>

    <!-- Chat Input -->
    <footer class="chat-input-area" id="chatInputArea">
      <div class="camera-icon" onclick="alert('Camera feature coming soon!')">📷</div>
      <div class="input-wrapper">
        <input type="text" id="messageInput" placeholder="Message..." autocomplete="off">
        <button id="recordBtn" class="record-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path></svg>
        </button>
        <button id="sendMessageBtn" class="send-btn" style="display:none;">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- CHAT INFO OVERLAY (Instagram Style) -->
  <div id="chatInfoOverlay" class="chat-info-overlay hidden">
    <div class="info-header">
      <button onclick="closeChatInfo()">←</button>
    </div>
    
    <div class="info-profile">
      <div class="info-avatar" id="infoAvatar">U</div>
      <h2 class="info-name" id="infoName">Loading...</h2>
    </div>

    <div class="info-actions">
      <div class="action-item"><span>👤</span> Profile</div>
      <div class="action-item"><span>🔍</span> Search</div>
      <div class="action-item" onclick="toggleMute()"><span id="muteIcon">🔔</span> <span id="muteText">Mute</span></div>
      <div class="action-item" onclick="toggleOptionsMenu()"><span>⋮</span> Options</div>
    </div>

    <!-- Options Dropdown -->
    <div id="infoOptionsMenu" class="info-options-menu hidden">
      <div onclick="alert('Restrict feature coming soon')">🚫 Restrict</div>
      <div onclick="blockUser()" style="color:#ff3b30;">⛔ Block</div>
      <div onclick="reportUser()" style="color:#ff3b30;">⚠️ Report</div>
    </div>

    <div class="info-list">
      <div class="list-item">
        <div class="list-icon" style="background: linear-gradient(45deg, #8a2be2, #4169e1);"></div>
        <div class="list-text">Theme <br><span>Default</span></div>
      </div>
      <div class="list-item">
        <div class="list-icon">⏱️</div>
        <div class="list-text">Disappearing messages <br><span>Off</span></div>
      </div>
      <div class="list-item" onclick="togglePin()">
        <div class="list-icon" id="pinIcon">📌</div>
        <div class="list-text" id="pinText">Pin to top</div>
      </div>
      <div class="list-item">
        <div class="list-icon">💬</div>
        <div class="list-text">Chat controls</div>
      </div>
      <div class="list-item">
        <div class="list-icon">🔒</div>
        <div class="list-text">Privacy and safety</div>
      </div>
      <div class="list-item">
        <div class="list-icon">👥</div>
        <div class="list-text">Create a group chat</div>
      </div>
    </div>
  </div>

  <script type="module" src="js/chat.js?v=25"></script>
</body>
</html>
