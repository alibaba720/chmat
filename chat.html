<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat - CHMAT</title>
  <link rel="stylesheet" href="css/chat.css?v=30">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Cinzel:wght@700&family=Playfair+Display:wght@700&display=swap');

    :root {
        --theme-bg-grad: linear-gradient(135deg, #000000, #3a0000, #000000);
        --theme-primary: #ff0000;
        --theme-text: #ffffff;
        --theme-border: #550000;
        --theme-font: 'Orbitron', sans-serif;
        --theme-btn-radius: 4px;
        --theme-btn-shadow: 0 0 10px #ff0000;
    }

    body { 
        background: var(--theme-bg-grad) !important; 
        background-attachment: fixed !important;
        color: var(--theme-text) !important; 
        font-family: var(--theme-font) !important;
        transition: background 0.5s, color 0.5s; 
    }
    
    .app-header, .bottom-nav, .chat-header, .settings-header { 
        background: rgba(0, 0, 0, 0.4) !important; 
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border-color: var(--theme-border) !important; 
    }
    
    .logo { color: var(--theme-primary) !important; text-shadow: 0 0 15px var(--theme-primary); }
    
    .post-card, .ig-grid-item, .dropdown-menu, .settings-group, .input-group, .theme-card { 
        background: rgba(20, 20, 20, 0.6) !important; 
        backdrop-filter: blur(5px) !important;
        border: 1px solid var(--theme-border) !important; 
    }
    
    button, .ig-btn, .btn-primary, .save-btn, .add-friend-btn, .ig-btn-blue { 
        background: var(--theme-primary) !important; 
        color: #fff !important; 
        border-radius: var(--theme-btn-radius) !important;
        box-shadow: var(--theme-btn-shadow) !important;
        font-family: var(--theme-font) !important;
    }
    
    .nav-item svg { stroke: var(--theme-text) !important; }
    .nav-item.active svg { fill: var(--theme-text) !important; }
    
    /* Override specific black backgrounds that might block the theme */
    .settings-container, .chat-container, .app-container { background: transparent !important; }
    .settings-item { border-color: var(--theme-border) !important; }
    .input-group input { background: transparent !important; color: var(--theme-text) !important; }

    
    /* --- STRICT WHITE QUEEN OVERRIDE (DO NOT REMOVE) --- */
    body.theme-white-queen { 
        background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%) !important; 
        color: #111111 !important; 
    }
    body.theme-white-queen .app-header, 
    body.theme-white-queen .bottom-nav,
    body.theme-white-queen .post-card,
    body.theme-white-queen .ig-top-bar,
    body.theme-white-queen .settings-group {
        background: rgba(255, 255, 255, 0.8) !important; 
        backdrop-filter: blur(10px) !important;
        border-color: #d4af37 !important; /* Gold Border */
    }
    body.theme-white-queen .logo { 
        color: #00e5ff !important; /* Icy Blue */
        text-shadow: 0 0 15px #00e5ff !important; 
    }
    body.theme-white-queen .nav-item svg { stroke: #b8860b !important; } /* Dark Gold */
    body.theme-white-queen .nav-item.active svg { 
        stroke: #00e5ff !important; 
        fill: #00e5ff !important; 
        filter: drop-shadow(0 0 5px #00e5ff) !important;
    }
    body.theme-white-queen .ig-btn, 
    body.theme-white-queen .btn-primary, 
    body.theme-white-queen .action-btn,
    body.theme-white-queen .edit-profile-btn {
        background: #ffffff !important;
        color: #b8860b !important; /* Dark Gold Text */
        border: 1px solid #d4af37 !important; /* Gold Border */
    }
    body.theme-white-queen .ig-btn:active {
        background: #d4af37 !important;
        color: #ffffff !important;
    }
    /* Force text colors to be dark on ice background */
    body.theme-white-queen .display-name,
    body.theme-white-queen .ig-username,
    body.theme-white-queen .post-display-name,
    body.theme-white-queen .post-text,
    body.theme-white-queen .settings-item {
        color: #111111 !important;
    }


    /* --- FORCE ICE & GOLD (NO RED, NO BLACK) --- */
    
    /* 1. Background Ice White */
    body, .app-container, .post-card, .settings-group, .dropdown-menu, .bottom-nav, .app-header {
        background: linear-gradient(135deg, #f4f9ff 0%, #dbe9f4 100%) !important;
        background-color: #f4f9ff !important;
        color: #111111 !important;
    }

    /* 2. Kill all Red Borders/Lines, make them Gold */
    * {
        border-color: #d4af37 !important; /* Force Gold */
    }
    .bottom-nav { border-top: 2px solid #d4af37 !important; }
    .app-header, .ig-top-bar { border-bottom: 1px solid #d4af37 !important; }
    .post-card, .settings-group { border: 1px solid #d4af37 !important; }

    /* 3. Logo Icy Blue */
    .logo { 
        color: #00e5ff !important; 
        text-shadow: 0 0 15px #00e5ff !important; 
    }

    /* 4. Text Colors */
    h1, h2, h3, span, p, .display-name, .ig-username, .post-text, .settings-item {
        color: #111111 !important;
    }

    /* 5. Icons */
    .nav-item svg { stroke: #b8860b !important; } /* Dark Gold */
    .nav-item.active svg { 
        stroke: #00e5ff !important; 
        fill: #00e5ff !important; 
        filter: drop-shadow(0 0 5px #00e5ff) !important;
    }
    .header-icons svg { stroke: #d4af37 !important; fill: #d4af37 !important; } /* Heart icon Gold */

    /* 6. Buttons */
    button, .ig-btn, .btn-primary, .action-btn {
        background: #ffffff !important;
        color: #b8860b !important;
        border: 1px solid #d4af37 !important;
    }
    button:active, .ig-btn:active {
        background: #d4af37 !important;
        color: #ffffff !important;
    }

    /* 7. Input Fields */
    input, textarea, .comment-input-area {
        background: rgba(255, 255, 255, 0.7) !important;
        color: #111111 !important;
        border: 1px solid #d4af37 !important;
    }

</style>
</head>
<body>
  <div class="chat-container">
    <!-- Chat Header -->
    <header class="chat-header" id="mainChatHeader">
      <div style="display:flex; align-items:center; flex:1;">
        <button class="back-btn" onclick="window.history.back()">←</button>
        <div class="chat-user-info">
          <div class="chat-avatar" id="chatAvatar">U</div>
          <div class="chat-name" id="chatName">Loading...</div>
        </div>
      </div>
      <div class="chat-header-icons">
        <span onclick="openSearch()" style="cursor:pointer;">🔍</span>
        <span onclick="alert('Video Call coming soon!')">📹</span>
        <span onclick="openChatInfo()" style="cursor:pointer;">ℹ️</span>
      </div>
    </header>

    <!-- Search Bar (Hidden by default) -->
    <div id="searchContainer" class="search-container hidden">
      <input type="text" id="chatSearchInput" placeholder="Search in chat..." oninput="performSearch()">
      <button onclick="closeSearch()">✕</button>
    </div>

    <!-- Search Results -->
    <div id="searchResultsList" class="search-results-list hidden"></div>

    <!-- Chat Messages -->
    <main class="chat-messages" id="chatMessages"></main>

    <!-- Recording Overlay -->
    <div id="recordingOverlay" class="recording-overlay hidden">
      <div class="recording-content">
        <button class="delete-record-btn" onclick="cancelRecording()">🗑️</button>
        <div id="recordingTimer" class="recording-timer">0:00</div>
        <button class="stop-record-btn" onclick="stopAndSendRecording()">➡️</button>
      </div>
    </div>

    <!-- Chat Input -->
    <footer class="chat-input-area" id="chatInputArea">
      <div class="camera-icon" onclick="alert('Camera coming soon!')">📷</div>
      <div class="input-wrapper">
        <input type="text" id="messageInput" placeholder="Message..." autocomplete="off">
        <button id="recordBtn" class="record-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path></svg>
        </button>
        <button id="sendMessageBtn" class="send-btn" style="display:none;">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- CHAT INFO OVERLAY -->
  <div id="chatInfoOverlay" class="chat-info-overlay hidden">
    <div class="info-header"><button onclick="closeChatInfo()">←</button></div>
    <div class="info-profile">
      <div class="info-avatar" id="infoAvatar">U</div>
      <h2 class="info-name" id="infoName">Loading...</h2>
    </div>
    <div class="info-actions">
      <div class="action-item" onclick="openPrivacyModal()"><span>🔒</span> Privacy</div>
      <div class="action-item" onclick="openSearch()"><span>🔍</span> Search</div>
      <div class="action-item" onclick="openMuteModal()"><span id="muteIcon">🔔</span> <span id="muteText">Mute</span></div>
      <div class="action-item" onclick="toggleOptionsMenu()"><span>⋮</span> Options</div>
    </div>
    
    <div id="infoOptionsMenu" class="info-options-menu hidden">
      <div onclick="blockUser()" style="color:#ff3b30;">⛔ Block</div>
      <div onclick="reportUser()" style="color:#ff3b30;">⚠️ Report</div>
    </div>

    <div class="info-list">
      <div class="list-item" onclick="openDisappearingModal()">
        <div class="list-icon">⏱️</div>
        <div class="list-text">Disappearing messages <br><span id="disappearStatus">Off</span></div>
      </div>
      <div class="list-item" onclick="togglePin()">
        <div class="list-icon" id="pinIcon">📍</div>
        <div class="list-text" id="pinText">Pin to top</div>
      </div>
    </div>
  </div>

  <!-- MUTE MODAL -->
  <div id="muteModal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3>Mute Notifications</h3>
      <button onclick="setMute('1h')">For 1 hour</button>
      <button onclick="setMute('24h')">For 24 hours</button>
      <button onclick="setMute('forever')">Until I turn it back on</button>
      <button class="cancel-btn" onclick="closeMuteModal()">Cancel</button>
    </div>
  </div>

  <!-- DISAPPEARING MODAL -->
  <div id="disappearModal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3>Disappearing Messages</h3>
      <p>New messages will disappear from this chat after the selected time.</p>
      <button onclick="setDisappear('Off')">Off</button>
      <button onclick="setDisappear('24h')">24 hours</button>
      <button onclick="setDisappear('7d')">7 days</button>
      <button class="cancel-btn" onclick="closeDisappearingModal()">Cancel</button>
    </div>
  </div>

  <script type="module" src="js/chat_v2.js"></script>
  <script src="js/themes.js"></script>
</body>
</html>
