<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat - CHMAT</title>
  <link rel="stylesheet" href="css/chat.css?v=10">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <button class="back-btn" onclick="window.location.href='app.html'">←</button>
      <div class="chat-user-info">
        <div class="chat-avatar" id="chatAvatar">U</div>
        <div class="chat-name" id="chatName">Loading...</div>
      </div>
    </header>

    <main class="chat-messages" id="chatMessages"></main>

    <!-- Voice Recording Overlay (Waving UI) -->
    <div id="recordingOverlay" style="display:none; position:absolute; bottom:70px; left:0; width:100%; background:#1a1a1a; padding:15px; align-items:center; justify-content:center; gap:10px; border-top:1px solid #333;">
        <div style="color:#ff3b30; font-size:20px; animation: pulse 1s infinite;">●</div>
        <div style="color:#fff; font-size:16px;" id="recordingTime">0:00</div>
        <div style="color:#888; font-size:14px;">Recording...</div>
    </div>

    <footer class="chat-input-area">
      <div class="input-wrapper">
        <input type="text" id="messageInput" placeholder="Message..." autocomplete="off">
        <button id="recordBtn" class="record-btn">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path></svg>
        </button>
      </div>
      <button id="sendMessageBtn" class="send-btn" style="display:none;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"></path>
        </svg>
      </button>
    </footer>
  </div>

  <!-- Chat Options Modal (Long Press) -->
  <div id="chatOptionsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999; background:rgba(0,0,0,0.7); align-items:flex-end;">
    <div onclick="closeChatOptions()" style="position:absolute; width:100%; height:100%;"></div>
    <div style="background:#1c1c1e; width:100%; border-radius:20px 20px 0 0; padding:20px 0; position:relative; display:flex; flex-direction:column;">
      <div style="text-align:center; padding-bottom:15px; border-bottom:1px solid #333; margin-bottom:10px; color:#888; font-size:13px; font-weight:bold;">Message Options</div>
      <div onclick="deleteMessageAction()" style="padding:16px 20px; display:flex; align-items:center; gap:15px; cursor:pointer; color:#ff3b30; font-size:15px; font-weight:bold;"><span style="font-size:20px;">🗑️</span> Delete Message</div>
      <div onclick="replyMessageAction()" style="padding:16px 20px; display:flex; align-items:center; gap:15px; cursor:pointer; color:#fff; font-size:15px;"><span style="font-size:20px;">↩️</span> Reply</div>
      <div onclick="closeChatOptions()" style="padding:16px 20px; text-align:center; color:#aaa; cursor:pointer; border-top:1px solid #333; margin-top:10px;">Cancel</div>
    </div>
  </div>

  <script type="module" src="js/chat.js?v=10"></script>
</body>
</html>
