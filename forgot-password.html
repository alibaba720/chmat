<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Forgot Password - CHMAT</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="auth-container">
    <div class="logo-container">
      <h1 class="logo-text">CHMAT</h1>
    </div>

    <div class="form-container">
      <h2 style="text-align: center; margin-bottom: 20px; font-size: 18px;">Find your account</h2>
      <p style="text-align: center; color: #aaa; font-size: 14px; margin-bottom: 20px;">Enter your username or mobile number to reset your password.</p>
      
      <input type="text" id="resetIdentifier" placeholder="Username or Mobile number" autocomplete="off">
      
      <button class="btn-primary" id="findAccountBtn">Find Account</button>
      
      <div class="bottom-box" style="border: none; margin-top: 20px;">
        <span class="toggle-btn" onclick="window.location.href='login.html'">← Back to Login</span>
      </div>
    </div>
  </div>

  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
