<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Themes - CHMAT</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    .header { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid #262626; position: sticky; top: 0; background: #000; z-index: 100; }
    .back-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; margin-right: 15px; }
    h2 { margin: 0; font-size: 18px; font-weight: 600; }
    
    .section-title { padding: 16px; font-size: 16px; font-weight: bold; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; }
    
    .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 16px 16px; }
    
    .theme-card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
    .theme-card:active { transform: scale(0.96); }
    
    .theme-card.reserved { border-color: #ffd700; background: linear-gradient(135deg, #1a1a1a 0%, #2a2000 100%); }
    
    .color-preview { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
    .color-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #333; }
    
    .theme-name { font-size: 14px; font-weight: bold; color: #fff; }
    .theme-badge { position: absolute; top: 5px; right: 5px; font-size: 16px; }
    
    /* Professional Popup */
    .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; }
    .popup-box { background: #111; border: 1px solid #ffd700; border-radius: 16px; padding: 24px; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
    .popup-box h3 { color: #ffd700; margin-top: 0; font-size: 20px; }
    .popup-box p { color: #ccc; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    .popup-close { background: #ffd700; color: #000; border: none; padding: 10px 24px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="window.history.back()">←</button>
    <h2>Themes</h2>
  </div>

  <div id="themesContainer">
    <!-- Themes will load here -->
  </div>

  <!-- Reserved Theme Popup -->
  <div id="reservedPopup" class="popup-overlay">
    <div class="popup-box">
      <h3 id="reservedTitle">Access Denied</h3>
      <p id="reservedText">This theme is reserved.</p>
      <button class="popup-close" onclick="document.getElementById('reservedPopup').style.display='none'">OK</button>
    </div>
  </div>

  <script src="js/themes.js"></script>
  <script src="js/themes_ui.js"></script>
</body>
</html>
