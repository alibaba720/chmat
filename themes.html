<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Themes - CHMAT</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
    
    .header { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid #222; position: sticky; top: 0; background: rgba(0,0,0,0.9); z-index: 100; }
    .back-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; margin-right: 15px; }
    h2 { margin: 0; font-size: 18px; font-weight: 600; }
    
    /* Split Layout */
    .split-container { display: flex; width: 100%; height: calc(100vh - 60px); }
    
    .column { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 10px; }
    .column-left { border-right: 1px solid #222; background: rgba(20, 0, 0, 0.1); }
    .column-right { background: rgba(0, 0, 20, 0.1); }
    
    .column-title { text-align: center; font-size: 14px; font-weight: bold; padding: 10px 0; position: sticky; top: 0; background: #000; z-index: 10; letter-spacing: 1px; }
    .column-left .column-title { color: #ff4444; }
    .column-right .column-title { color: #44aaff; }
    
    .theme-card { 
        margin-bottom: 12px; padding: 15px 10px; border-radius: 12px; 
        text-align: center; cursor: pointer; transition: 0.2s; 
        border: 1px solid #333; position: relative; overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .theme-card:active { transform: scale(0.95); }
    
    .theme-card.reserved { border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
    .theme-badge { position: absolute; top: 5px; right: 5px; font-size: 16px; }
    
    .theme-name { font-size: 13px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px #000; }
    
    /* Popup */
    .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; }
    .popup-box { background: #111; border: 1px solid #ffd700; border-radius: 16px; padding: 24px; width: 85%; max-width: 350px; text-align: center; }
    .popup-box h3 { color: #ffd700; margin-top: 0; font-size: 20px; }
    .popup-box p { color: #ccc; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    .popup-close { background: #ffd700; color: #000; border: none; padding: 10px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Cinzel:wght@700&family=Playfair+Display:wght@700&display=swap');

    :root {
        --theme-bg-grad: linear-gradient(135deg, #000000, #3a0000, #000000);
        --theme-primary: #ff0000;
        --theme-text: #ffffff;
        --theme-border: #550000;
        --theme-font: 'Orbitron', sans-serif;
        --theme-btn-radius: 4px;
        --theme-btn-shadow: 0 0 10px #ff0000;
    }

    body { 
        background: var(--theme-bg-grad) !important; 
        background-attachment: fixed !important;
        color: var(--theme-text) !important; 
        font-family: var(--theme-font) !important;
        transition: background 0.5s, color 0.5s; 
    }
    
    .app-header, .bottom-nav, .chat-header, .settings-header { 
        background: rgba(0, 0, 0, 0.4) !important; 
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border-color: var(--theme-border) !important; 
    }
    
    .logo { color: var(--theme-primary) !important; text-shadow: 0 0 15px var(--theme-primary); }
    
    .post-card, .ig-grid-item, .dropdown-menu, .settings-group, .input-group, .theme-card { 
        background: rgba(20, 20, 20, 0.6) !important; 
        backdrop-filter: blur(5px) !important;
        border: 1px solid var(--theme-border) !important; 
    }
    
    button, .ig-btn, .btn-primary, .save-btn, .add-friend-btn, .ig-btn-blue { 
        background: var(--theme-primary) !important; 
        color: #fff !important; 
        border-radius: var(--theme-btn-radius) !important;
        box-shadow: var(--theme-btn-shadow) !important;
        font-family: var(--theme-font) !important;
    }
    
    .nav-item svg { stroke: var(--theme-text) !important; }
    .nav-item.active svg { fill: var(--theme-text) !important; }
    
    /* Override specific black backgrounds that might block the theme */
    .settings-container, .chat-container, .app-container { background: transparent !important; }
    .settings-item { border-color: var(--theme-border) !important; }
    .input-group input { background: transparent !important; color: var(--theme-text) !important; }


    /* --- V4: ULTIMATE THEME VISUALS & ICONS --- */
    
    /* 1. Fix Backgrounds: Make all containers transparent so the gradient shows */
    body, .app-container, .settings-container, .chat-container, .post-card, .ig-grid-item, .settings-group, .input-group, .dropdown-menu, .comment-sheet, .modal-content {
        background: transparent !important;
    }
    
    /* Create a glass effect for cards */
    .post-card, .settings-group, .dropdown-menu, .theme-card {
        background: rgba(10, 10, 10, 0.5) !important;
        backdrop-filter: blur(15px) !important;
        -webkit-backdrop-filter: blur(15px) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37) !important;
    }

    /* 2. Top Header & Notification Heart */
    .app-header, .settings-header, .chat-header {
        background: rgba(0, 0, 0, 0.6) !important;
        backdrop-filter: blur(10px) !important;
        border-bottom: 1px solid var(--theme-primary) !important; /* Glowing bottom border */
    }
    
    /* Change Heart Icon Color & Glow */
    .header-icons svg, #notiBtn svg {
        stroke: var(--theme-primary) !important;
        fill: var(--theme-primary) !important;
        filter: drop-shadow(0 0 8px var(--theme-primary));
        transition: 0.3s;
    }

    /* 3. Bottom Navigation Icons (Home, Search, Post, Chat, Profile) */
    .bottom-nav {
        background: rgba(0, 0, 0, 0.8) !important;
        backdrop-filter: blur(15px) !important;
        border-top: 1px solid var(--theme-primary) !important;
    }
    
    .nav-item svg {
        stroke: var(--theme-text) !important;
        fill: none !important;
        transition: all 0.3s ease;
    }
    
    /* Active Button: Give it the Theme Primary Color and a Neon Glow */
    .nav-item.active svg {
        stroke: var(--theme-primary) !important;
        fill: var(--theme-primary) !important;
        filter: drop-shadow(0 0 10px var(--theme-primary));
        transform: scale(1.1);
    }

    /* 4. Buttons (Like, Comment, Edit Profile, etc) */
    .action-btn, .ig-btn, .save-btn, .btn-primary, .add-friend-btn {
        background: transparent !important;
        color: var(--theme-primary) !important;
        border: 1px solid var(--theme-primary) !important;
        box-shadow: 0 0 10px rgba(0,0,0,0.5) inset !important;
        text-shadow: 0 0 5px var(--theme-primary) !important;
        transition: 0.3s;
    }
    
    .action-btn:active, .ig-btn:active, .btn-primary:active {
        background: var(--theme-primary) !important;
        color: #000 !important; /* Dark text on bright button click */
        box-shadow: 0 0 20px var(--theme-primary) !important;
    }
    
    /* Like button specific */
    .action-btn.liked {
        color: #ff3b30 !important;
        border-color: #ff3b30 !important;
        text-shadow: 0 0 10px #ff3b30 !important;
    }

    /* 5. Text Colors and Tabs */
    .ig-username, .ig-name, .post-display-name, h2, h3 {
        color: var(--theme-text) !important;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    
    .ig-tab.active {
        color: var(--theme-primary) !important;
        border-bottom: 2px solid var(--theme-primary) !important;
        text-shadow: 0 0 8px var(--theme-primary);
    }
    
    .ig-tab {
        color: #888 !important;
    }

    /* 6. Input Fields */
    input, textarea, #messageInput, #commentInput {
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid var(--theme-border) !important;
        color: var(--theme-text) !important;
    }
    
    input:focus, textarea:focus {
        border-color: var(--theme-primary) !important;
        box-shadow: 0 0 8px var(--theme-primary) !important;
    }
    
    /* Logo Glow */
    .logo {
        color: var(--theme-primary) !important;
        text-shadow: 0 0 15px var(--theme-primary), 0 0 30px var(--theme-primary) !important;
    }

</style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="window.history.back()">←</button>
    <h2>Themes</h2>
  </div>

  <div class="split-container">
    <!-- Left Side -->
    <div class="column column-left" id="demonsColumn">
        <div class="column-title">Villain's Aura</div>
    </div>

    <!-- Right Side -->
    <div class="column column-right" id="angelsColumn">
        <div class="column-title">Superheroes</div>
    </div>
  </div>

  <div id="reservedPopup" class="popup-overlay">
    <div class="popup-box">
      <h3 id="reservedTitle">Access Denied</h3>
      <p id="reservedText">This theme is reserved.</p>
      <button class="popup-close" onclick="document.getElementById('reservedPopup').style.display='none'">OK</button>
    </div>
  </div>

  <script src="js/themes.js"></script>
  <script src="js/themes_ui.js"></script>
</body>
</html>
