<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Themes - CHMAT</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
    
    .header { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid #222; position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 100; }
    .back-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; margin-right: 15px; }
    h2 { margin: 0; font-size: 18px; font-weight: 600; }

    /* CATEGORY SELECTION VIEW */
    .category-container { display: flex; flex-direction: column; padding: 20px; gap: 20px; height: calc(100vh - 60px); justify-content: center; }
    .category-btn { position: relative; height: 200px; border-radius: 20px; overflow: hidden; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #333; transition: 0.3s; }
    .category-btn:active { transform: scale(0.96); }
    .category-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }
    .category-content { position: relative; z-index: 2; text-align: center; }
    .category-icon { font-size: 50px; margin-bottom: 10px; display: block; }
    .category-title { font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

    /* LIST VIEW */
    .list-container { display: none; flex-direction: column; padding: 20px; }
    .section-title { padding: 10px 0 20px 0; font-size: 22px; font-weight: bold; color: var(--theme-primary, #0095f6); text-transform: uppercase; letter-spacing: 1px; }
    
    .theme-card { position: relative; border-radius: 16px; overflow: hidden; cursor: pointer; height: 180px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
    .theme-card:active { transform: scale(0.98); }
    .theme-bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
    .theme-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.2) 100%); }
    .theme-content { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; z-index: 2; }
    .theme-name { font-size: 22px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
    .theme-caption { font-size: 13px; color: #ccc; margin-top: 5px; font-style: italic; }
    .theme-badge { position: absolute; top: 15px; right: 15px; font-size: 24px; z-index: 2; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 50%; border: 2px solid #ffd700; }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" id="mainBackBtn" onclick="window.history.back()">←</button>
    <button class="back-btn" id="listBackBtn" style="display:none;" onclick="showCategoryView()">←</button>
    <h2 id="pageTitle">Themes</h2>
  </div>

  <!-- Category Selection -->
  <div id="categoryView" class="category-container">
      <!-- Hero Button -->
      <div class="category-btn" onclick="showThemeList('angel')" style="border-color:#ffd700;">
          <img src="https://images.unsplash.com/photo-1569003339405-ea396a5a8a90?q=80&w=600&auto=format&fit=crop" class="category-bg">
          <div class="category-content">
              <span class="category-icon">🦸‍♂️</span>
              <div class="category-title">Hero's Themes</div>
          </div>
      </div>
      <!-- Villain Button -->
      <div class="category-btn" onclick="showThemeList('demon')" style="border-color:#ff0000;">
          <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop" class="category-bg">
          <div class="category-content">
              <span class="category-icon">💀</span>
              <div class="category-title">Villains Themes</div>
          </div>
      </div>
  </div>

  <!-- Theme List View -->
  <div id="listView" class="list-container">
      <div id="themeGrid"></div>
  </div>

  <script src="js/themes.js"></script>
  <script src="js/themes_ui.js"></script>
</body>
</html>
