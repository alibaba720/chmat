<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Themes - CHMAT</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
    
    .header { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid #222; position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 100; }
    .back-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; margin-right: 15px; }
    h2 { margin: 0; font-size: 18px; font-weight: 600; }
    
    .section-title { padding: 20px 16px 10px 16px; font-size: 18px; font-weight: bold; color: #fff; }
    
    .theme-grid { display: flex; flex-direction: column; gap: 20px; padding: 0 16px 20px 16px; }
    
    /* BIG PREMIUM CARDS */
    .theme-card { 
        position: relative; border-radius: 16px; overflow: hidden; cursor: pointer; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333;
        height: 200px;
    }
    .theme-card:active { transform: scale(0.98); }
    
    .theme-bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
    
    /* Gradient overlay to make text readable */
    .theme-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.2) 100%); }
    
    .theme-content { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; z-index: 2; }
    .theme-name { font-size: 22px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
    .theme-caption { font-size: 13px; color: #ccc; margin-top: 5px; font-style: italic; }
    
    .theme-badge { position: absolute; top: 15px; right: 15px; font-size: 20px; z-index: 2; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 20px; }
    
    /* --- PREVIEW MODAL --- */
    .preview-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; flex-direction: column; }
    .preview-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #111; }
    .preview-header h3 { margin: 0; color: #fff; font-size: 18px; }
    .close-preview { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    
    /* Swipe Slider */
    .slider-container { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .slide { min-width: 100vw; height: 100%; scroll-snap-align: start; padding: 20px; display: flex; justify-content: center; align-items: center; background: var(--theme-bg-grad); transition: background 0.5s; }
    
    /* Fake UI Mockups inside slide */
    .mockup-phone { width: 100%; max-width: 320px; height: 80%; border-radius: 30px; border: 8px solid #222; background: #000; overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .mockup-header { height: 50px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; color: var(--theme-primary); font-weight: bold; }
    .mockup-body { flex: 1; padding: 15px; overflow-y: auto; color: var(--theme-text); }
    .mockup-post { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; margin-bottom: 15px; }
    .mockup-dm { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
    .mockup-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--theme-primary); }
    .mockup-btn { background: var(--theme-primary); color: #fff; border: none; padding: 8px 15px; border-radius: 8px; margin-top: 10px; width: 100%; font-weight: bold; }
    
    .preview-footer { padding: 20px; background: #111; text-align: center; }
    .apply-btn { background: var(--theme-primary); color: #fff; border: none; padding: 15px 30px; border-radius: 30px; font-size: 18px; font-weight: bold; width: 100%; box-shadow: 0 0 20px var(--theme-primary); cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="window.history.back()">←</button>
    <h2>Themes</h2>
  </div>

  <div class="section-title">☀️ Superheroes</div>
  <div class="theme-grid" id="angelsGrid"></div>

  <div class="section-title">🌑 Villain's Aura</div>
  <div class="theme-grid" id="demonsGrid"></div>

  <!-- PREVIEW MODAL -->
  <div id="previewModal" class="preview-modal">
    <div class="preview-header">
      <h3 id="previewThemeName">Theme Preview</h3>
      <button class="close-preview" onclick="closePreview()">✕</button>
    </div>
    
    <div class="slider-container" id="previewSlider">
      <!-- Slide 1: Home Feed -->
      <div class="slide">
        <div class="mockup-phone">
          <div class="mockup-header"><span>CHMAT</span><span>🤍</span></div>
          <div class="mockup-body">
            <div class="mockup-post">
              <div style="display:flex; gap:10px; align-items:center;"><div class="mockup-avatar"></div><b>Beinghuman</b></div>
              <p style="font-size:12px; margin-top:10px;">This is how the feed will look with this theme. The vibe is real!</p>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Slide 2: DM -->
      <div class="slide">
        <div class="mockup-phone">
          <div class="mockup-header"><span>Messages</span><span>+</span></div>
          <div class="mockup-body">
            <div class="mockup-dm"><div class="mockup-avatar"></div><div><b>User 1</b><br><small style="color:#888;">Hey, how are you?</small></div></div>
            <div class="mockup-dm"><div class="mockup-avatar"></div><div><b>User 2</b><br><small style="color:#888;">Send me that file.</small></div></div>
          </div>
        </div>
      </div>

      <!-- Slide 3: Profile -->
      <div class="slide">
        <div class="mockup-phone">
          <div class="mockup-header"><span>Profile</span><span>☰</span></div>
          <div class="mockup-body" style="text-align:center;">
            <div class="mockup-avatar" style="width:80px; height:80px; margin:0 auto;"></div>
            <h2 style="margin:10px 0 5px 0;">@beinghuman</h2>
            <button class="mockup-btn">Edit Profile</button>
          </div>
        </div>
      </div>
    </div>

    <div class="preview-footer">
      <p style="color:#888; font-size:12px; margin-bottom:10px;">← Swipe to test sections →</p>
      <button class="apply-btn" id="finalApplyBtn">Apply Theme</button>
    </div>
  </div>

  <script src="js/themes.js"></script>
  <script src="js/themes_ui.js"></script>
</body>
</html>
