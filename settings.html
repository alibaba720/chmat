<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settings - CHMAT</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    .settings-container { max-width: 600px; margin: 0 auto; min-height: 100vh; }
    
    /* Header */
    .settings-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #262626; }
    .settings-header h2 { font-size: 18px; font-weight: 600; margin: 0; }
    .back-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 0; width: 24px; }

    /* Menu Items */
    .settings-group { display: flex; flex-direction: column; }
    .settings-item { padding: 16px; border-bottom: 1px solid #262626; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 15px; transition: background 0.2s; }
    .settings-item:active { background: #1a1a1a; }
    .chevron { color: #737373; font-size: 20px; }

    /* Inputs */
    .input-group { padding: 16px; border-bottom: 1px solid #262626; }
    .input-group label { display: block; font-size: 12px; color: #a8a8a8; margin-bottom: 4px; }
    .input-group input { width: 100%; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; padding: 0; font-family: inherit; }
    .input-group input::placeholder { color: #555; }
    .input-group input:disabled { color: #737373; cursor: not-allowed; }

    /* Buttons */
    .save-btn { margin: 20px 16px; padding: 14px; border-radius: 8px; border: none; background: #0095f6; color: #fff; font-weight: 600; font-size: 14px; width: calc(100% - 32px); cursor: pointer; transition: opacity 0.2s; }
    .save-btn:active { opacity: 0.7; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="settings-container">
    <header class="settings-header">
      <button class="back-btn" id="backBtn">←</button>
      <h2 id="pageTitle">Settings</h2>
      <div style="width: 24px;"></div> <!-- Spacer -->
    </header>

    <!-- MAIN MENU -->
    <div id="mainMenu" class="settings-content">
      <div class="settings-group">
        <div class="settings-item" id="menuAccount">
          <span>Account</span>
          <span class="chevron">›</span>
        </div>
        <div class="settings-item" id="menuSecurity">
          <span>Security</span>
          <span class="chevron">›</span>
        </div>
        <div class="settings-item" id="menuLogout" style="color: #ff3b30; border-bottom: none;">
          <span>Logout</span>
        </div>
      </div>
    </div>

    <!-- ACCOUNT SECTION -->
    <div id="accountSection" class="settings-content hidden">
      <div class="settings-group">
        <div class="input-group">
          <label>Username (Permanent)</label>
          <input type="text" id="setUsername" disabled>
        </div>
        <div class="input-group">
          <label>Primary Mobile</label>
          <input type="text" id="setMobile1">
        </div>
        <div class="input-group">
          <label>Secondary Mobile (Backup)</label>
          <input type="text" id="setMobile2" placeholder="Optional">
        </div>
        <div class="input-group">
          <label>Primary Email</label>
          <input type="email" id="setEmail1">
        </div>
        <div class="input-group">
          <label>Secondary Email (Backup)</label>
          <input type="email" id="setEmail2" placeholder="Optional">
        </div>
      </div>
      <button class="save-btn" id="saveDetailsBtn">Save Details</button>
    </div>

    <!-- SECURITY SECTION -->
    <div id="securitySection" class="settings-content hidden">
      <div class="settings-group">
        <div class="input-group">
          <label>New Password</label>
          <input type="password" id="newPassword" placeholder="Enter new password">
        </div>
      </div>
      <button class="save-btn" id="changePasswordBtn" style="background: #262626; border: 1px solid #333;">Update Password</button>
    </div>
  </div>

  <script type="module" src="js/settings.js?v=3"></script>
</body>
</html>
