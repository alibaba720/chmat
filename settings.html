<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settings - CHMAT</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    .settings-container { max-width: 600px; margin: 0 auto; min-height: 100vh; }
    
    /* Header */
    .settings-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #262626; }
    .settings-header h2 { font-size: 18px; font-weight: 600; margin: 0; }
    .back-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 0; width: 24px; }

    /* Menu Items */
    .settings-group { display: flex; flex-direction: column; }
    .settings-item { padding: 16px; border-bottom: 1px solid #262626; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 15px; transition: background 0.2s; }
    .settings-item:active { background: #1a1a1a; }
    .chevron { color: #737373; font-size: 20px; }

    /* Inputs */
    .input-group { padding: 16px; border-bottom: 1px solid #262626; }
    .input-group label { display: block; font-size: 12px; color: #a8a8a8; margin-bottom: 4px; }
    .input-group input { width: 100%; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; padding: 0; font-family: inherit; }
    .input-group input::placeholder { color: #555; }
    .input-group input:disabled { color: #737373; cursor: not-allowed; }

    /* Buttons */
    .save-btn { margin: 20px 16px; padding: 14px; border-radius: 8px; border: none; background: #0095f6; color: #fff; font-weight: 600; font-size: 14px; width: calc(100% - 32px); cursor: pointer; transition: opacity 0.2s; }
    .save-btn:active { opacity: 0.7; }
    
    .hidden { display: none !important; }
  
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Cinzel:wght@700&family=Playfair+Display:wght@700&display=swap');

    :root {
        --theme-bg-grad: linear-gradient(135deg, #000000, #3a0000, #000000);
        --theme-primary: #ff0000;
        --theme-text: #ffffff;
        --theme-border: #550000;
        --theme-font: 'Orbitron', sans-serif;
        --theme-btn-radius: 4px;
        --theme-btn-shadow: 0 0 10px #ff0000;
    }

    body { 
        background: var(--theme-bg-grad) !important; 
        background-attachment: fixed !important;
        color: var(--theme-text) !important; 
        font-family: var(--theme-font) !important;
        transition: background 0.5s, color 0.5s; 
    }
    
    .app-header, .bottom-nav, .chat-header, .settings-header { 
        background: rgba(0, 0, 0, 0.4) !important; 
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border-color: var(--theme-border) !important; 
    }
    
    .logo { color: var(--theme-primary) !important; text-shadow: 0 0 15px var(--theme-primary); }
    
    .post-card, .ig-grid-item, .dropdown-menu, .settings-group, .input-group, .theme-card { 
        background: rgba(20, 20, 20, 0.6) !important; 
        backdrop-filter: blur(5px) !important;
        border: 1px solid var(--theme-border) !important; 
    }
    
    button, .ig-btn, .btn-primary, .save-btn, .add-friend-btn, .ig-btn-blue { 
        background: var(--theme-primary) !important; 
        color: #fff !important; 
        border-radius: var(--theme-btn-radius) !important;
        box-shadow: var(--theme-btn-shadow) !important;
        font-family: var(--theme-font) !important;
    }
    
    .nav-item svg { stroke: var(--theme-text) !important; }
    .nav-item.active svg { fill: var(--theme-text) !important; }
    
    /* Override specific black backgrounds that might block the theme */
    .settings-container, .chat-container, .app-container { background: transparent !important; }
    .settings-item { border-color: var(--theme-border) !important; }
    .input-group input { background: transparent !important; color: var(--theme-text) !important; }


    
    body { background: var(--theme-bg-grad) !important; color: var(--theme-text) !important; }
    .settings-container { background: transparent !important; }
    .settings-header { background: rgba(0,0,0,0.5) !important; backdrop-filter: blur(10px); border-bottom: 1px solid var(--theme-border); }
    .settings-group { background: rgba(20,20,20,0.6) !important; backdrop-filter: blur(10px); border: 1px solid var(--theme-border) !important; border-radius: 12px; margin: 16px; overflow: hidden; }
    .settings-item { border-bottom: 1px solid var(--theme-border) !important; color: var(--theme-text) !important; }
    .settings-item:last-child { border-bottom: none !important; }
    .input-group { background: transparent !important; border-bottom: 1px solid var(--theme-border) !important; }
    .input-group label { color: var(--theme-text) !important; opacity: 0.7; }
    .input-group input { color: var(--theme-text) !important; background: transparent !important; }
    .save-btn { background: var(--theme-primary) !important; color: #fff !important; border-radius: 8px; }
    .back-btn { color: var(--theme-text) !important; }


    
    /* --- STRICT WHITE QUEEN OVERRIDE (DO NOT REMOVE) --- */
    body.theme-white-queen { 
        background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%) !important; 
        color: #111111 !important; 
    }
    body.theme-white-queen .app-header, 
    body.theme-white-queen .bottom-nav,
    body.theme-white-queen .post-card,
    body.theme-white-queen .ig-top-bar,
    body.theme-white-queen .settings-group {
        background: rgba(255, 255, 255, 0.8) !important; 
        backdrop-filter: blur(10px) !important;
        border-color: #d4af37 !important; /* Gold Border */
    }
    body.theme-white-queen .logo { 
        color: #00e5ff !important; /* Icy Blue */
        text-shadow: 0 0 15px #00e5ff !important; 
    }
    body.theme-white-queen .nav-item svg { stroke: #b8860b !important; } /* Dark Gold */
    body.theme-white-queen .nav-item.active svg { 
        stroke: #00e5ff !important; 
        fill: #00e5ff !important; 
        filter: drop-shadow(0 0 5px #00e5ff) !important;
    }
    body.theme-white-queen .ig-btn, 
    body.theme-white-queen .btn-primary, 
    body.theme-white-queen .action-btn,
    body.theme-white-queen .edit-profile-btn {
        background: #ffffff !important;
        color: #b8860b !important; /* Dark Gold Text */
        border: 1px solid #d4af37 !important; /* Gold Border */
    }
    body.theme-white-queen .ig-btn:active {
        background: #d4af37 !important;
        color: #ffffff !important;
    }
    /* Force text colors to be dark on ice background */
    body.theme-white-queen .display-name,
    body.theme-white-queen .ig-username,
    body.theme-white-queen .post-display-name,
    body.theme-white-queen .post-text,
    body.theme-white-queen .settings-item {
        color: #111111 !important;
    }


    /* --- FORCE ICE & GOLD (NO RED, NO BLACK) --- */
    
    /* 1. Background Ice White */
    body, .app-container, .post-card, .settings-group, .dropdown-menu, .bottom-nav, .app-header {
        background: linear-gradient(135deg, #f4f9ff 0%, #dbe9f4 100%) !important;
        background-color: #f4f9ff !important;
        color: #111111 !important;
    }

    /* 2. Kill all Red Borders/Lines, make them Gold */
    * {
        border-color: #d4af37 !important; /* Force Gold */
    }
    .bottom-nav { border-top: 2px solid #d4af37 !important; }
    .app-header, .ig-top-bar { border-bottom: 1px solid #d4af37 !important; }
    .post-card, .settings-group { border: 1px solid #d4af37 !important; }

    /* 3. Logo Icy Blue */
    .logo { 
        color: #00e5ff !important; 
        text-shadow: 0 0 15px #00e5ff !important; 
    }

    /* 4. Text Colors */
    h1, h2, h3, span, p, .display-name, .ig-username, .post-text, .settings-item {
        color: #111111 !important;
    }

    /* 5. Icons */
    .nav-item svg { stroke: #b8860b !important; } /* Dark Gold */
    .nav-item.active svg { 
        stroke: #00e5ff !important; 
        fill: #00e5ff !important; 
        filter: drop-shadow(0 0 5px #00e5ff) !important;
    }
    .header-icons svg { stroke: #d4af37 !important; fill: #d4af37 !important; } /* Heart icon Gold */

    /* 6. Buttons */
    button, .ig-btn, .btn-primary, .action-btn {
        background: #ffffff !important;
        color: #b8860b !important;
        border: 1px solid #d4af37 !important;
    }
    button:active, .ig-btn:active {
        background: #d4af37 !important;
        color: #ffffff !important;
    }

    /* 7. Input Fields */
    input, textarea, .comment-input-area {
        background: rgba(255, 255, 255, 0.7) !important;
        color: #111111 !important;
        border: 1px solid #d4af37 !important;
    }

</style>
</head>
<body>
  <div class="settings-container">
    <header class="settings-header">
      <button class="back-btn" id="backBtn">←</button>
      <h2 id="pageTitle">Settings</h2>
      <div style="width: 24px;"></div> <!-- Spacer -->
    </header>

    <!-- MAIN MENU -->
    <div id="mainMenu" class="settings-content">
      <div class="settings-group">
        <div class="settings-item" id="menuAccount">
          <span>Account</span>
          <span class="chevron">›</span>
        </div>
        
        <div class="settings-item" onclick="window.location.href='themes.html'">
          <span>🎨 Themes</span>
          <span class="chevron">›</span>
        </div>

        <div class="settings-item" id="menuSecurity">
          <span>Security</span>
          <span class="chevron">›</span>
        </div>
        <div class="settings-item" id="menuLogout" style="color: #ff3b30; border-bottom: none;">
          <span>Logout</span>
        </div>
      </div>
    </div>

    <!-- ACCOUNT SECTION -->
    <div id="accountSection" class="settings-content hidden">
      <div class="settings-group">
        <div class="input-group">
          <label>Username (Permanent)</label>
          <input type="text" id="setUsername" disabled>
        </div>
        <div class="input-group">
          <label>Primary Mobile</label>
          <input type="text" id="setMobile1">
        </div>
        <div class="input-group">
          <label>Secondary Mobile (Backup)</label>
          <input type="text" id="setMobile2" placeholder="Optional">
        </div>
        <div class="input-group">
          <label>Primary Email</label>
          <input type="email" id="setEmail1">
        </div>
        <div class="input-group">
          <label>Secondary Email (Backup)</label>
          <input type="email" id="setEmail2" placeholder="Optional">
        </div>
      </div>
      <button class="save-btn" id="saveDetailsBtn">Save Details</button>
    </div>

    <!-- SECURITY SECTION -->
    <div id="securitySection" class="settings-content hidden">
      <div class="settings-group">
        <div class="input-group">
          <label>New Password</label>
          <input type="password" id="newPassword" placeholder="Enter new password">
        </div>
      </div>
      <button class="save-btn" id="changePasswordBtn" style="background: #262626; border: 1px solid #333;">Update Password</button>
    </div>
  </div>

  <script type="module" src="js/settings.js?v=3"></script>
  <script src="js/themes.js"></script>
</body>
</html>
